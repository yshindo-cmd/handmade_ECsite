    <!-- トップへ戻るボタン -->
<a href="#" id="scrollTopBtn" class="scroll-top-btn" aria-label="ページ上部へ戻る">
  ▲ TOP
</a>


  <script>
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const sliderContainer = document.querySelector('.slider-container');
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;

    if (scrollTopBtn) {
      window.addEventListener('scroll', () => {
        // 300px以上スクロールしたら 'is-active' クラスを付与して表示
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add('is-active');
        } else {
          scrollTopBtn.classList.remove('is-active');
        }
      });
    }

    function updateSlider() {
      // スライドを横にずらす計算
      const amountToMove = -currentIndex * 100;
      sliderContainer.style.transform = `translateX(${amountToMove}%)`;

      // アクティブなスライド（中央）のクラスを付け替え
      slides.forEach((slide, index) => {
        if (index === currentIndex) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
      });
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      updateSlider();
    }

    // 最初のリセット＆6秒ごとに自動スライド
    updateSlider();
    setInterval(nextSlide, 6000);
  </script>
